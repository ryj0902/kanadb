# 설치: pre-commit install  (수동 실행: pre-commit run --all-files)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: v1.46.4
    hooks:
      - id: djlint-reformat-django
        files: ^templates/.*\.html$
      - id: djlint-django
        files: ^templates/.*\.html$
