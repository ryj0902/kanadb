<html lang="{{ LANGUAGE_CODE }}">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{% endblock %}KanaDB</title>
    <link rel="stylesheet" href="{% static 'css/base/tokens.css' %}">

    <link rel="stylesheet" href="{% static 'css/components/deck-card.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/deck-summary.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "navbar.html" %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
