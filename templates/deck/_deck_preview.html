{% load static %}
{% if card_character %}
    {% include "deck/_deck_preview_card.html" with card=card_character character_slot=True %}
{% endif %}
<div class="deck-preview__summary">
    <div class="deck-preview__count">
        <img class="deck-preview__count-icon" src="{% static 'card/Texture2D/UI_icon_card.webp' %}" alt="">
        <p class="deck-preview__count-value{% if num_cards > deck_size %} is-over-limit{% endif %}">{{ num_cards }}</p>
        <p class="deck-preview__count-total">/ {{ deck_size }}</p>
    </div>
    <p class="deck-preview__point">{{ deck_points }} PT</p>
</div>
{% for card in deck_card_list %}
    {% include "deck/_deck_preview_card.html" %}
{% endfor %}
