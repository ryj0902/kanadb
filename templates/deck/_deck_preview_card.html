<div class="deck-card" data-action="select-card" data-card-id="{{ card.id }}" draggable="true">
    <div class="deck-card__art" style="background-image: url({{ card.deck_image_url }});" data-card-art></div>
    <div class="deck-card__frame" style="background-image: url({{ card.deck_frame_url }});"></div>
    {% if not character_slot %}<div class="deck-card__size-frame" style="background-image: url({{ card.deck_frame_size_url }})"></div>{% endif %}
    <div class="deck-card__enhance-frame" style="background-image: url({{ card.frame_enhance_url }})"{% if card.enhance == 0 %} hidden{% endif %}></div>
    <div class="deck-card__stat deck-card__stat--enhance"{% if card.enhance == 0 %} hidden{% endif %}>{{ card.enhance }}</div>
    {% if not character_slot %}
        <div class="deck-card__stat deck-card__stat--size"{% if card.is_character %} hidden{% endif %}>{{ card.size }}</div>
        <div class="deck-card__stat deck-card__stat--count">x {{ card.count }}</div>
    {% endif %}
    <div class="deck-card__stat deck-card__stat--name">{{ card.localized_name }}</div>
</div>
